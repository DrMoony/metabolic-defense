<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제은행 리뷰본 — Metabolic Defense</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 32px 60px; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; background:#fff; color:#1a1a1a; line-height:1.55; font-size:14px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#666; font-size:13px; margin-bottom:16px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  select, button, input { font:inherit; padding:6px 10px; border:1px solid #bbb; border-radius:6px; background:#fff; }
  button { cursor:pointer; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th, td { border:1px solid #ccc; padding:8px 10px; vertical-align:top; font-size:13px; }
  th { background:#f2f2f2; text-align:left; }
  td.n { width:52px; color:#666; }
  td.d { width:58px; }
  td.q { width:20%; font-weight:600; }
  td.a ol { margin:0; padding-left:18px; }
  td.a li.ok { font-weight:700; color:#0a6b3a; }
  td.e { width:16%; }
  td.s { width:20%; font-size:12px; color:#333; }
  td.v { width:22%; font-size:12px; }
  td.v blockquote { margin:6px 0; padding:6px 8px; border-left:3px solid #7dbf9a; background:#f4faf6; white-space:pre-wrap; }
  td.v .note { color:#8a5a00; font-size:11.5px; margin-top:4px; }
  td.s a { color:#0645ad; word-break:break-all; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 6px; border-radius:5px; }
  .easy { background:#e3f7ea; color:#0a6b3a; } .mid { background:#fff3d6; color:#8a5a00; } .hard { background:#fde2e6; color:#a1203a; }
  @media print { .bar { display:none; } body { padding:0; font-size:11px; } th, td { font-size:10.5px; padding:5px 6px; } h1 { font-size:16px; } }
</style>
</head>
<body>
<h1>문제은행 리뷰본 (Medical Review용)</h1>
<div class="sub">각 문항의 보기·정답(굵게)·해설·APA 참고문헌(DOI 포함)·<b>원문에서 그대로 가져온 근거 구문</b>(직접/부분, 전문/초록만 표시)을 한 표로 정리했어요. 인쇄(Ctrl/Cmd+P)하면 표만 나오고, CSV로도 내려받을 수 있어요. 게임 화면에는 같은 출처가 DOI 없이 표시돼요.</div>
<div class="bar">
  <select id="set"><option value="quiz_obesity">Clinical Obesity</option><option value="quiz_aasld">MASLD / MASH</option><option value="all">전체</option></select>
  <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select>
  <select id="diff"><option value="">난이도 전체</option><option value="easy">easy</option><option value="mid">mid</option><option value="hard">hard</option></select>
  <input id="q" placeholder="검색 (문항·해설·출처)" style="min-width:240px">
  <button id="csv">CSV 다운로드</button>
  <button onclick="window.print()">인쇄 / PDF</button>
  <span id="count" style="margin-left:auto;color:#666;font-size:12.5px"></span>
</div>
<details id="byref" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:700">근거 문헌별 문항 집계</summary><div id="byref-body" style="font-size:12.5px;margin-top:8px"></div></details>
<table><thead><tr><th>#</th><th>난이도</th><th>문항</th><th>보기 (정답 굵게)</th><th>해설</th><th>참고문헌 (APA)</th><th>원문 근거 구문</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const $ = id => document.getElementById(id);
let cache = {};
async function loadSet(name) {
  if (!cache[name]) cache[name] = await (await fetch(`./assets/${name}_${$('lang').value}.json?t=${Date.now()}`)).json();
  return cache[name];
}
function linkify(s) { return s.replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
async function render() {
  cache = {}; // 언어 바뀔 수 있으니 매번 새로
  const sets = $('set').value === 'all' ? ['quiz_obesity', 'quiz_aasld'] : [$('set').value];
  const filter = $('q').value.trim().toLowerCase(), diff = $('diff').value;
  let html = '', n = 0;
  for (const s of sets) {
    const rows = await loadSet(s);
    rows.forEach((r, i) => {
      if (diff && r.diff !== diff) return;
      const blob = (r.q + ' ' + r.a.join(' ') + ' ' + (r.exp || '') + ' ' + (r.src || '')).toLowerCase();
      if (filter && !blob.includes(filter)) return;
      n++;
      const label = (s === 'quiz_obesity' ? 'OB' : 'MA') + '-' + String(i + 1).padStart(3, '0');
      html += `<tr><td class="n">${label}</td><td class="d"><span class="tag ${r.diff}">${r.diff}</span></td><td class="q">${r.q}</td>
        <td class="a"><ol>${r.a.map((a, k) => `<li class="${k === r.correct ? 'ok' : ''}">${a}${k === r.correct ? ' ✓' : ''}</li>`).join('')}</ol></td>
        <td class="e">${r.exp || '<i style="color:#a00">해설 없음</i>'}</td>
        <td class="s">${(r.src || '<i style="color:#a00">출처 없음</i>').split(' / ').map(x => `<div style="margin-bottom:6px">${linkify(x)}</div>`).join('')}</td>
        <td class="v">${r.evidence && r.evidence.quote ? `<span class="tag ${r.evidence.support === 'direct' ? 'easy' : 'mid'}">${r.evidence.support === 'direct' ? '직접' : '부분'}</span> <span class="tag ${r.evidence.access === 'fulltext' ? 'easy' : 'hard'}" title="근거를 확인한 범위">${r.evidence.access === 'fulltext' ? '전문' : '초록만'}</span> <span class="tag" style="background:#eee;color:#444">${((r.src || '').match(/\((\d{4})\)/) || [])[1] || ''}</span> <small>${r.evidence.locator || ''}</small><blockquote>${r.evidence.quote}</blockquote>${r.evidence.quote2 ? `<blockquote>${r.evidence.quote2}</blockquote>` : ''}${r.evidence.note ? `<div class="note">※ ${r.evidence.note}</div>` : ''}` : '<i style="color:#a00">원문 구문 없음</i>'}</td></tr>`;
    });
  }
  $('rows').innerHTML = html; $('count').textContent = `${n}문항`;
  // 문헌별 집계 (현재 세트·언어 기준, 필터 무관)
  const tally = {};
  for (const s of sets) (await loadSet(s)).forEach((r, i) => { const k = (r.evidence && r.evidence.ref) || (r.refs || ['?'])[0]; (tally[k] ||= { n: 0, ids: [], apa: (r.src || '').split(' / ')[0], access: r.evidence && r.evidence.access }).n++; tally[k].ids.push((s === 'quiz_obesity' ? 'OB' : 'MA') + '-' + String(i + 1).padStart(3, '0')); });
  $('byref-body').innerHTML = `<table style="font-size:12px"><thead><tr><th style="width:44%">근거 문헌</th><th>접근</th><th>문항 수</th><th>문항 ID</th></tr></thead><tbody>${Object.entries(tally).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => `<tr><td>${v.apa.replace(/\s*https?:\/\/doi\.org\/\S+/, '')}</td><td>${v.access === 'fulltext' ? '전문' : '초록'}</td><td>${v.n}</td><td>${v.ids.join(', ')}</td></tr>`).join('')}</tbody></table>`;
}
$('csv').addEventListener('click', async () => {
  const sets = $('set').value === 'all' ? ['quiz_obesity', 'quiz_aasld'] : [$('set').value];
  const lines = [['ID', '난이도', '문항', '보기1', '보기2', '보기3', '보기4', '정답번호', '해설', '참고문헌(APA)', '근거 구문', '근거 위치', '근거 수준', '근거 접근(전문/초록)', '비고']];
  for (const s of sets) (await loadSet(s)).forEach((r, i) => lines.push([(s === 'quiz_obesity' ? 'OB' : 'MA') + '-' + String(i + 1).padStart(3, '0'), r.diff, r.q, ...r.a, r.correct + 1, r.exp || '', r.src || '', (r.evidence || {}).quote || '', (r.evidence || {}).locator || '', (r.evidence || {}).support || '', (r.evidence || {}).access === 'fulltext' ? '전문' : '초록', (r.evidence || {}).note || '']));
  const csv = '﻿' + lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `metabolic-defense_quiz_${$('lang').value}.csv`; a.click();
});
['set', 'lang', 'diff'].forEach(id => $(id).addEventListener('change', render)); $('q').addEventListener('input', render);
render();
</script>
</body>
</html>
