<!doctype html>
<meta charset="utf-8">
<title>효과 그림 견본</title>
<style>
  body{margin:0;padding:16px;background:#2a2630;color:#eee;font:12px/1.3 system-ui}
  .grid{display:grid;grid-template-columns:repeat(9,132px);gap:10px}
  figure{margin:0;text-align:center}
  canvas{width:128px;height:128px;background:#3a3644;border-radius:6px}
</style>
<div class="grid" id="grid"></div>
<script type="module">
  // 효과 그림(gfx/toon.js)을 색 묶음별로 한 장에 펼쳐 본다. ?pal=heart.pulse 처럼 색을 고를 수 있다.
  import { T, TOON_SHAPES, toonCanvas } from './toon.js';
  const want = new URLSearchParams(location.search).get('pal') || 'hit', [a, b] = want.split('.'), pal = b ? T[a][b] : T[a];
  for (const shape of TOON_SHAPES) {
    const fig = document.createElement('figure'), c = toonCanvas(shape, pal);
    fig.append(c, shape); document.getElementById('grid').append(fig);
  }
  document.title = 'ready';
</script>
