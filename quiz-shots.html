<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문항 캡처 — Metabolic Defense</title>
<link rel="stylesheet" href="./astra/style.css">
<style>
  html,body{margin:0;height:100%;}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#140a12;}
  #stage::before{content:"";position:absolute;inset:0;background:url("./assets/bg.jpg") center/cover;filter:brightness(.42) saturate(.9);}
  .screen{position:absolute;inset:0;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="stage">
  <section id="quiz-screen" class="screen veil"><article class="panel quiz-panel"><div class="quiz-top"><small id="quiz-tag"></small><b id="quiz-seconds"></b></div><div class="track"><i id="quiz-time"></i></div><h2 id="question"></h2><p id="hint">정답을 고른 뒤 제출을 한 번 더 쏘세요. 정답이면 무기 승급 + 장기 회복!</p><div id="answers"></div><div id="explain" class="explain hidden"></div><div class="quiz-bottom"><p id="feedback" role="status"></p><button id="submit" class="primary" disabled>정답 제출 →</button><button id="quiz-next" class="primary hidden">계속하기 →</button></div><small id="source"></small></article></section>
</div>
<script>
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const SET = P.get('set') || 'quiz_diabetes';
const LANG = P.get('lang') || 'ko';
const IDX = parseInt(P.get('i') || '0', 10);
const MODE = P.get('mode') || 'q';       // q = 문제, a = 해설
const SETNAME = { quiz_diabetes: '당뇨 (Diabetes)', quiz_dm_empa: '당뇨 - Empa only' }[SET] || SET;
const PREFIX = { quiz_diabetes: 'DB', quiz_dm_empa: 'DM' }[SET] || '??';

(async () => {
  const rows = await (await fetch(`./assets/${SET}_${LANG}.json?t=${Date.now()}`)).json();
  const r = rows[IDX];
  const id = `${PREFIX}-${String(IDX + 1).padStart(3, '0')}`;
  const diff = { easy: 'EASY', mid: 'NORMAL', hard: 'HARD' }[r.diff] || 'NORMAL';
  $('quiz-tag').textContent = `${SETNAME} · ${id} · ${diff}`;
  $('quiz-seconds').textContent = MODE === 'q' ? '15s' : '—';
  $('quiz-time').style.width = MODE === 'q' ? '100%' : '0%';
  $('question').textContent = r.q;
  const wrap = $('answers');
  r.a.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'answer';
    b.textContent = text;
    if (MODE === 'a') {
      if (i === r.correct) b.classList.add('correct');
      b.disabled = true;
    }
    wrap.appendChild(b);
  });
  if (MODE === 'a') {
    $('hint').classList.add('hidden');
    $('feedback').textContent = `정답! 정답은 "${r.a[r.correct]}"`;
    const ex = $('explain');
    ex.replaceChildren(
      Object.assign(document.createElement('b'), { textContent: '해설' }),
      Object.assign(document.createElement('span'), { textContent: r.exp || '' })
    );
    if (r.evidence && r.evidence.quote) {
      const q = document.createElement('blockquote');
      q.textContent = '원문 근거: ' + r.evidence.quote;
      q.style.cssText = 'margin:10px 0 0;padding:8px 12px;border-left:3px solid rgba(125,255,176,.6);font-size:.86em;opacity:.85;line-height:1.5;';
      ex.appendChild(q);
      const loc = document.createElement('div');
      loc.textContent = '근거 위치: ' + (r.evidence.locator || '');
      loc.style.cssText = 'margin-top:6px;font-size:.8em;opacity:.65;';
      ex.appendChild(loc);
    }
    ex.classList.remove('hidden');
    $('submit').classList.add('hidden');
    $('quiz-next').classList.remove('hidden');
  }
  $('source').textContent = r.src ? '출처: ' + r.src.replace(/\s*https?:\/\/doi\.org\/\S+/g, '') : '';
  document.title = `${id} ${MODE === 'q' ? '문제' : '해설'}`;
  window.__ready = true;
})();
</script>
</body>
</html>
